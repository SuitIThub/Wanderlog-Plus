# Baut bei jedem Versionssprung (versionName in app/build.gradle.kts) eine signierte APK und veröffentlicht sie als
# GitHub-Release "v<version>". Die App sucht dort nach Updates. Gibt es den Tag schon, passiert nichts.
#
# Benötigte Repository-Secrets (Settings > Secrets and variables > Actions):
#   WLP_KEYSTORE_BASE64   Release-Keystore (release.jks) als Base64
#   WLP_KEYSTORE_PASSWORD Passwort des Keystores
#   WLP_KEY_ALIAS         Alias des Schlüssels
#   WLP_KEY_PASSWORD      Passwort des Schlüssels
name: Release APK

on:
  push:
    branches: [main]
    paths: [app/build.gradle.kts]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Version lesen
        id: version
        run: |
          v=$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts | head -1)
          if [ -z "$v" ]; then echo "versionName nicht gefunden" >&2; exit 1; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$v" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$v gibt es schon – nichts zu tun."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Java einrichten
        if: steps.version.outputs.exists == 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle einrichten
        if: steps.version.outputs.exists == 'false'
        uses: gradle/actions/setup-gradle@v4

      - name: Keystore bereitstellen
        if: steps.version.outputs.exists == 'false'
        env:
          WLP_KEYSTORE_BASE64: ${{ secrets.WLP_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$WLP_KEYSTORE_BASE64" ]; then echo "Secret WLP_KEYSTORE_BASE64 fehlt" >&2; exit 1; fi
          echo "$WLP_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "WLP_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK bauen
        if: steps.version.outputs.exists == 'false'
        env:
          WLP_KEYSTORE_PASSWORD: ${{ secrets.WLP_KEYSTORE_PASSWORD }}
          WLP_KEY_ALIAS: ${{ secrets.WLP_KEY_ALIAS }}
          WLP_KEY_PASSWORD: ${{ secrets.WLP_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon
          # Nur eine signierte APK heißt app-release.apk (unsigniert: app-release-unsigned.apk).
          cp app/build/outputs/apk/release/app-release.apk "wanderlog-plus-${{ steps.version.outputs.version }}.apk"

      - name: Changelog zusammenstellen
        if: steps.version.outputs.exists == 'false'
        run: |
          v="${{ steps.version.outputs.version }}"
          # Abschnitt "## <version>" aus CHANGELOG.md bis zum nächsten "## ".
          awk -v v="$v" '
            $0 ~ "^## " { if (found) exit; if ($2 == v) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > notes.md || true
          if [ ! -s notes.md ]; then
            prev=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
            if [ -n "$prev" ]; then range="$prev..HEAD"; else range="HEAD~20..HEAD"; fi
            git log --no-merges --pretty='- %s' "$range" > notes.md
          fi
          cat notes.md

      - name: Release veröffentlichen
        if: steps.version.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Wanderlog Plus ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: wanderlog-plus-${{ steps.version.outputs.version }}.apk
